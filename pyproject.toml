[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-compile"
version = "0.1.0"
description = "Manage agent templates and compile agent instances for the ARC Power platform."
requires-python = ">=3.11"
authors = [{name = "ARC Power"}]
license = {text = "Proprietary"}
readme = "README.md"
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "ruamel.yaml>=0.18",
    "rich>=13.0",
    "requests>=2.31",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
agent-compile = "agent_compile.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
