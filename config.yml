registry:
  root: ~/ansible/registry

ghcr:
  org: jobcpf

paths:
  templates_dir: agent_templates
  image_defaults_dir: image_defaults
  agent_registry_file: agent_registry.yml
  compatibility_matrix_file: compatibility_matrix.yml
  compiled_root: .compiled/agents
  skills_library_dir: skills
  # dprox_endpoints.yml is generated by the dprox apply playbook into .compiled/
  # (per dprox-design-spec-v0.2). Contract: .atlas/components/dprox/docs/provides/ (dprox-endpoints-file)
  dprox_endpoints_file: .compiled/dprox_endpoints.yml
  # compiled_plan.yml is written by rbac-compile into .compiled/ — the source of
  # an agent's group NAMES (agent_users[].groups).
  # Contract: .atlas/components/rbac-compile/docs/provides/ (compiled-rbac-plan)
  compiled_plan_file: .compiled/compiled_plan.yml
  # group_gid_map.yml is written ON ASSIGN by ansible-platform's
  # export_group_gids.yml into .compiled/ — the source of group NUMBERS.
  # Contract: pending (ansible-platform to publish; ADR-0013 R6).
  group_gid_map_file: .compiled/group_gid_map.yml
  # org_routing.yml lives outside the registry root (inventory/, not registry/).
  # Relative paths resolve against registry.root; absolute paths used as-is.
  org_routing_file: ../inventory/group_vars/all/org_routing.yml

bless:
  recency_window_days: 30

snapshot:
  ssh_options:
    - "-o"
    - "BatchMode=yes"
    - "-o"
    - "ConnectTimeout=10"

flavours:
  openclaw:
    config_filename: openclaw.json
    image_line: openclaw-runtime
    health_endpoint: /healthz
    ready_endpoint: /readyz
    port_env_var: OPENCLAW_PORT
    default_port: 18789
    port_range_low: 28789
    port_range_high: 28999
    # ssh (ADR-0013 D6): allocated exactly like the gateway port, never
    # hand-kept in the registry. Must not overlap the gateway range.
    ssh_port_range_low: 29789
    ssh_port_range_high: 29999
    instance_fields_list: templates/instance-fields/openclaw.yml
    endpoints_file: openclaw_endpoints.yml
