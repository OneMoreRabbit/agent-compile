name: marketing_arc
version: 1
flavour: openclaw
parent: image_defaults:openclaw:2026.5.5-r1
description: "Marketing agent baseline for ARC."

derived_from:
  kind: hand_authored
  source: ""
  at: 2026-05-14T11:00:00Z

overrides:
  openclaw_json:
    # A configured template supplies the `agent` block (incl. a model).
    # agent-compile merges agent.name in per instance; it never creates a
    # bare partial `agent` block (openclaw rejects name-without-model).
    agent:
      model: anthropic/claude-sonnet-4
    channels:
      discord:
        enabled: true
        dmPolicy: "free"
        token: { source: env, provider: default, id: DISCORD_BOT_TOKEN }
    # A dprox-using template configures the dprox block (cert paths);
    # agent-compile fills in dprox.endpoint per instance.
    dprox:
      ca_cert: /agent/configs/main/tls/ca.crt
      client_cert: /agent/configs/main/tls/client.crt
      client_key: /agent/configs/main/tls/client.key

  workspace:
    SOUL.md: |
      # Marketing agent persona

      You are a marketing-focused agent for ARC Power.

  skills:
    add:
      - social_channel_etiquette

secret_manifest:
  - SOCIAL_API_KEY

preferred_image: openclaw:2026.5.5-r1
